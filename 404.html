<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Médico AI Blog</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8f9fc; color: #111827; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo img { height: 80px; width: auto; }
    .logo-divider { font-size: 1.6rem; color: #ccc; font-weight: 300; margin: 0 8px; }
    .logo-label { font-size: 1.3rem; font-weight: 600; color: #333; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
    .error-code { font-size: 6rem; font-weight: 800; color: #3B5BDB; line-height: 1; margin-bottom: 16px; }
    .error-msg { font-size: 1.2rem; color: #6b7280; margin-bottom: 32px; }
    .back-btn { display: inline-block; background: #3B5BDB; color: #fff; font-weight: 600; font-size: 0.95rem; padding: 12px 28px; border-radius: 8px; text-decoration: none; transition: background 0.2s; }
    .back-btn:hover { background: #2F4AC4; }
    footer { background: #fff; border-top: 1px solid #e5e7eb; padding: 24px 40px; display: flex; align-items: center; justify-content: center; }
    footer p { font-size: 0.82rem; color: #6b7280; }
    footer a { color: #3B5BDB; text-decoration: none; }
    @media (max-width: 640px) {
      header { padding: 0 12px; }
      .logo img { height: 50px; }
      .error-code { font-size: 4rem; }
    }
  </style>
</head>
<body>
<header>
  <a class="logo" href="/index.html">
    <img src="/logo.png" alt="Médico AI" width="120" height="80">
    <span class="logo-divider">|</span>
    <span class="logo-label">Blog</span>
  </a>
</header>
<main>
  <div>
    <div class="error-code">404</div>
    <p class="error-msg">A página que você procura não foi encontrada.</p>
    <a class="back-btn" href="/index.html">Voltar para artigos</a>
  </div>
</main>
<footer>
  <p>&copy; 2025 <a href="https://medicoai.com.br" target="_blank">Médico AI</a></p>
</footer>
</body>
</html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:      #3B5BDB;
      --blue-dark: #2F4AC4;
      --blue-light:#EEF2FF;
      --text:      #111827;
      --muted:     #6b7280;
      --border:    #e5e7eb;
      --bg:        #f8f9fc;
      --white:     #ffffff;
      --radius:    12px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; line-height: 1.7; }

    /* Header */
    header { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo img { height: 80px; }
    .logo-divider { font-size: 1.6rem; color: #ccc; font-weight: 300; margin: 0 8px; }
    .logo-label { font-size: 1.3rem; font-weight: 600; color: #333; }
    .header-cta { background: var(--blue); color: #fff; font-weight: 600; font-size: 0.87rem; padding: 9px 20px; border-radius: 8px; text-decoration: none; transition: background 0.2s; }
    .header-cta:hover { background: var(--blue-dark); }

    /* Article */
    main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.85rem; text-decoration: none; margin-bottom: 40px; transition: color 0.2s; }
    .back-link:hover { color: var(--blue); }
    .article-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .article-fonte { font-size: 0.72rem; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.08em; background: var(--blue-light); padding: 3px 10px; border-radius: 999px; }
    .article-data { font-size: 0.82rem; color: var(--muted); }
    h1.article-title { font-size: clamp(1.7rem, 3.5vw, 2.5rem); font-weight: 800; line-height: 1.2; letter-spacing: -0.3px; margin-bottom: 32px; }
    .article-img { width: 100%; height: auto; border-radius: var(--radius); display: block; margin-bottom: 40px; border: 1px solid var(--border); }

    /* Body */
    .article-body { font-size: 1.05rem; line-height: 1.85; color: #374151; }
    .article-body p { margin-bottom: 20px; }
    .article-body h2, .article-body h3 { font-size: 1.3rem; font-weight: 700; margin: 36px 0 14px; color: var(--text); }
    .article-body strong { color: var(--text); font-weight: 600; }
    .article-body em { font-style: italic; }
    .article-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

    .article-divider { height: 1px; background: var(--border); margin: 48px 0; }

    /* CTA */
    .article-cta { background: linear-gradient(135deg, #3B5BDB, #4C6EF5); border-radius: 16px; padding: 40px 32px; text-align: center; color: #fff; margin: 48px 0; }
    .article-cta h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .article-cta p { color: rgba(255,255,255,0.82); margin-bottom: 24px; font-size: 0.95rem; }
    .article-cta a { display: inline-block; background: #fff; color: var(--blue); font-weight: 700; font-size: 0.9rem; padding: 12px 28px; border-radius: 8px; text-decoration: none; transition: opacity 0.2s, transform 0.2s; }
    .article-cta a:hover { opacity: 0.92; transform: translateY(-2px); }

    /* State */
    .state { text-align: center; padding: 80px 0; color: var(--muted); }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer { background: var(--white); border-top: 1px solid var(--border); padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    footer p { font-size: 0.82rem; color: var(--muted); }
    footer a { color: var(--blue); text-decoration: none; }

    @media (max-width: 640px) {
      header { padding: 0 12px; gap: 8px; }
      .logo img { height: 50px; }
      .logo-divider { font-size: 1.1rem; margin: 0 4px; }
      .logo-label { font-size: 0.95rem; }
      .header-cta { font-size: 0.75rem; padding: 7px 14px; white-space: nowrap; }
      main { padding: 36px 20px 60px; }
      footer { padding: 20px; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<header>

    <img src="logo.png" alt="Médico AI">
    <span class="logo-divider">|</span>

  </a>
  <a class="header-cta" href="https://medicoai.com.br" target="_blank" rel="noopener">30 Dias Grátis →</a>
</header>

<main id="content">
  <div class="state"><div class="spinner"></div><p>Carregando artigo...</p></div>
</main>

<footer>
  <p>© 2025 <a href="https://medicoai.com.br" target="_blank">Médico AI</a></p>
  <p>Curadoria e análise por <a href="https://medicoai.com.br" target="_blank">medicoai.com.br</a></p>
</footer>

<script>
  const SUPABASE_URL = 'https://dizkzzxquztoeqtjkcib.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpemt6enhxdXp0b2VxdGprY2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTYyMzcsImV4cCI6MjA5MDc5MjIzN30.9FslqZBkneQWzpiv6CyASardK_8hoRjzvaaqovdtNAA';
  const TABLE    = 'noticias_medico';
  const BASE_URL = 'https://blog.medicoai.com.br';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function formatDateISO(iso) { return iso ? new Date(iso).toISOString() : ''; }

  function renderMarkdown(text) {
    if (!text) return '';
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .split(/\n{2,}/)
      .map(b => b.trim()).filter(Boolean)
      .map(b => {
        if (/^#{1,3}\s/.test(b)) return `<h2>${b.replace(/^#{1,3}\s/, '')}</h2>`;
        if (/^<strong>/.test(b) && b.endsWith('</strong>')) return `<h3>${b}</h3>`;
        return `<p>${b.replace(/\n/g, '<br>')}</p>`;
      }).join('\n');
  }

  function injectMeta({ title, description, image, slug, pubDate }) {
    const canonical = `${BASE_URL}/artigo.html?slug=${slug}`;
    document.title = `${title} — Médico AI`;
    const setMeta = (sel, attr, val) => {
      let el = document.querySelector(sel);
      if (!el) { el = document.createElement('meta'); document.head.appendChild(el); }
      el.setAttribute(attr, val);
    };
    setMeta('meta[name="description"]', 'content', description);
    setMeta('link[rel="canonical"]', 'href', canonical);
    setMeta('meta[property="og:type"]', 'content', 'article');
    setMeta('meta[property="og:title"]', 'content', title);
    setMeta('meta[property="og:description"]', 'content', description);
    setMeta('meta[property="og:url"]', 'content', canonical);
    setMeta('meta[property="og:site_name"]', 'content', 'Médico AI');
    setMeta('meta[property="og:locale"]', 'content', 'pt_BR');
    if (image) setMeta('meta[property="og:image"]', 'content', image);
    if (pubDate) setMeta('meta[property="article:published_time"]', 'content', formatDateISO(pubDate));
    setMeta('meta[name="twitter:card"]', 'content', 'summary_large_image');
    setMeta('meta[name="twitter:title"]', 'content', title);
    setMeta('meta[name="twitter:description"]', 'content', description);
    if (image) setMeta('meta[name="twitter:image"]', 'content', image);
  }

  function injectJsonLd(data) {
    const pageUrl = `${BASE_URL}/artigo.html?slug=${data.slug || data.id}`;
    const schema = {
      '@context': 'https://schema.org', '@type': 'Article',
      headline: data.titulo,
      datePublished: formatDateISO(data.publicado_em),
      publisher: { '@type': 'Organization', name: 'Médico AI', url: 'https://medicoai.com.br' },
      mainEntityOfPage: { '@type': 'WebPage', '@id': pageUrl },
    };
    if (data.imagem_github) schema.image = data.imagem_github;
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(schema);
    document.head.appendChild(s);
  }

  async function loadArtigo() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const id   = params.get('id');

    // Redirect to static page if slug is available
    if (slug) {
      window.location.replace(`/artigos/${slug}.html`);
      return;
    }
    const content = document.getElementById('content');

    if (!slug && !id) {
      content.innerHTML = `<div class="state"><p>⚠️</p><p>Artigo não encontrado.</p><a href="index.html" style="color:var(--blue);display:block;margin-top:16px">← Voltar</a></div>`;
      return;
    }

    let query = sb.from(TABLE).select('*');
    query = slug ? query.eq('slug', slug) : query.eq('id', id);
    const { data, error } = await query.single();

    if (error || !data) {
      content.innerHTML = `<div class="state"><p>📭</p><p style="margin-top:12px">Artigo não encontrado.</p><a href="index.html" style="color:var(--blue);display:block;margin-top:16px">← Voltar</a></div>`;
      return;
    }

    const desc = (data.artigo_completo || data.titulo).replace(/[#*\n]/g, ' ').slice(0, 160);
    injectMeta({ title: data.titulo, description: desc, image: data.imagem_github, slug: data.slug || data.id, pubDate: data.publicado_em });
    injectJsonLd(data);

    content.innerHTML = `
      <a class="back-link" href="index.html">← Voltar para artigos</a>
      <div class="article-meta">
        <span class="article-fonte">${data.fonte || 'Saúde'}</span>
        <span class="article-data">${formatDate(data.publicado_em)}</span>
      </div>
      <h1 class="article-title">${data.titulo}</h1>
      <div class="article-body">${renderMarkdown(data.artigo_completo || '')}</div>
      <div class="article-divider"></div>
      <div class="article-cta">
        <h3>Economize 15h por mês no consultório</h3>
        <p>O Médico AI transcreve consultas, gera prontuários SOAP, prescrições digitais e pedidos de exame — tudo em segundos.</p>
        <a href="https://medicoai.com.br" target="_blank" rel="noopener">Conhecer o Médico AI →</a>
      </div>
    `;
  }

  loadArtigo();
</script>
</body>

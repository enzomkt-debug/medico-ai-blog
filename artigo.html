<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Médico AI</title>
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://dizkzzxquztoeqtjkcib.supabase.co" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080d1a;
      --bg2:     #0d1526;
      --bg3:     #111e33;
      --accent:  #00c9ff;
      --accent2: #0077ff;
      --text:    #f0f4ff;
      --muted:   rgba(160,185,220,0.65);
      --border:  rgba(0,201,255,0.12);
      --radius:  14px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      line-height: 1.7;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,201,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,201,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,13,26,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--text);
    }

    .logo-text span { color: var(--accent); }

    .header-cta {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .header-cta:hover { opacity: 0.85; }

    /* ── Content ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      margin-bottom: 40px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    /* ── Article meta ── */
    .article-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .article-fonte {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(0,201,255,0.1);
      border: 1px solid rgba(0,201,255,0.2);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .article-data {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* ── Título ── */
    h1.article-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.2;
      letter-spacing: -0.3px;
      margin-bottom: 32px;
    }

    /* ── Imagem ── */
    .article-img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: var(--radius);
      display: block;
      margin-bottom: 40px;
      border: 1px solid var(--border);
    }

    /* ── Corpo ── */
    .article-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: rgba(240,244,255,0.9);
    }

    .article-body p { margin-bottom: 20px; }

    .article-body h2, .article-body h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      margin: 36px 0 16px;
      color: var(--text);
    }

    .article-body strong { color: var(--text); font-weight: 600; }
    .article-body em { font-style: italic; color: var(--muted); }

    .article-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Divider ── */
    .article-divider {
      height: 1px;
      background: var(--border);
      margin: 48px 0;
    }

    /* ── CTA inline ── */
    .article-cta {
      background: linear-gradient(135deg, rgba(0,119,255,0.12), rgba(0,201,255,0.06));
      border: 1px solid rgba(0,201,255,0.2);
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      margin: 48px 0;
    }

    .article-cta h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .article-cta p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .article-cta a {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #000;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .article-cta a:hover { opacity: 0.88; transform: translateY(-2px); }

    /* ── State ── */
    .state {
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer p { font-size: 0.82rem; color: var(--muted); }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 640px) {
      header { padding: 0 20px; }
      main { padding: 40px 20px 60px; }
      footer { padding: 24px 20px; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <div class="logo-icon">🧠</div>
    <span class="logo-text">Médico <span>AI</span></span>
  </a>
  <a class="header-cta" href="https://medicoai.com.br" target="_blank" rel="noopener">Experimentar grátis →</a>
</header>

<main id="content">
  <div class="state"><div class="spinner"></div><p>Carregando artigo...</p></div>
</main>

<footer>
  <p>© 2025 Médico AI — <a href="https://medicoai.com.br" target="_blank">medicoai.com.br</a></p>
  <p>Curadoria e análise por <a href="https://medicoai.com.br" target="_blank">@medicoai</a></p>
</footer>

<script>
  const SUPABASE_URL = 'https://dizkzzxquztoeqtjkcib.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpemt6enhxdXp0b2VxdGprY2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1MzY0MjMsImV4cCI6MjA1OTExMjQyM30.6gQEHAvbpyBRVFMxYideMiVMKKqBNLK-n1eVCn7FVKA';
  const TABLE        = 'noticias_medico';
  const BASE_URL     = 'https://noticias.medicoai.com.br';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function formatDateISO(iso) {
    return iso ? new Date(iso).toISOString() : '';
  }

  function renderMarkdown(text) {
    if (!text) return '';
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .split(/\n{2,}/)
      .map(b => b.trim())
      .filter(Boolean)
      .map(b => {
        if (/^#{1,3}\s/.test(b)) return `<h2>${b.replace(/^#{1,3}\s/, '')}</h2>`;
        if (/^<strong>/.test(b) && b.endsWith('</strong>')) return `<h3>${b}</h3>`;
        return `<p>${b.replace(/\n/g, '<br>')}</p>`;
      })
      .join('\n');
  }

  function injectMeta({ title, description, image, slug, pubDate }) {
    const canonical = `${BASE_URL}/artigo.html?slug=${slug}`;
    document.title = `${title} — Médico AI`;

    const setMeta = (sel, attr, val) => {
      let el = document.querySelector(sel);
      if (!el) { el = document.createElement('meta'); document.head.appendChild(el); }
      el.setAttribute(attr, val);
    };

    setMeta('meta[name="description"]',        'content', description);
    setMeta('link[rel="canonical"]',           'href',    canonical);
    setMeta('meta[property="og:type"]',        'content', 'article');
    setMeta('meta[property="og:title"]',       'content', title);
    setMeta('meta[property="og:description"]', 'content', description);
    setMeta('meta[property="og:url"]',         'content', canonical);
    setMeta('meta[property="og:site_name"]',   'content', 'Médico AI');
    setMeta('meta[property="og:locale"]',      'content', 'pt_BR');
    if (image) setMeta('meta[property="og:image"]', 'content', image);
    if (pubDate) setMeta('meta[property="article:published_time"]', 'content', formatDateISO(pubDate));
    setMeta('meta[name="twitter:card"]',        'content', 'summary_large_image');
    setMeta('meta[name="twitter:title"]',       'content', title);
    setMeta('meta[name="twitter:description"]', 'content', description);
    if (image) setMeta('meta[name="twitter:image"]', 'content', image);
  }

  function injectJsonLd(data) {
    const pageUrl = `${BASE_URL}/artigo.html?slug=${data.slug || data.id}`;
    const schema = {
      '@context': 'https://schema.org',
      '@type': 'Article',
      headline: data.titulo,
      datePublished: formatDateISO(data.publicado_em),
      publisher: {
        '@type': 'Organization',
        name: 'Médico AI',
        url: 'https://medicoai.com.br',
      },
      mainEntityOfPage: { '@type': 'WebPage', '@id': pageUrl },
    };
    if (data.imagem_github) schema.image = data.imagem_github;
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(schema);
    document.head.appendChild(s);
  }

  async function loadArtigo() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const id   = params.get('id');
    const content = document.getElementById('content');

    if (!slug && !id) {
      content.innerHTML = `<div class="state"><p style="font-size:2rem">⚠️</p><p style="margin-top:12px">Artigo não encontrado.</p><a href="index.html" style="color:var(--accent);display:block;margin-top:16px">← Voltar</a></div>`;
      return;
    }

    let query = sb.from(TABLE).select('*');
    query = slug ? query.eq('slug', slug) : query.eq('id', id);
    const { data, error } = await query.single();

    if (error || !data) {
      content.innerHTML = `<div class="state"><p style="font-size:2rem">📭</p><p style="margin-top:12px">Artigo não encontrado.</p><a href="index.html" style="color:var(--accent);display:block;margin-top:16px">← Voltar</a></div>`;
      return;
    }

    const desc = (data.artigo_completo || data.titulo).replace(/[#*\n]/g, ' ').slice(0, 160);
    injectMeta({ title: data.titulo, description: desc, image: data.imagem_github, slug: data.slug || data.id, pubDate: data.publicado_em });
    injectJsonLd(data);

    const imgHTML = data.imagem_github
      ? `<img class="article-img" src="${data.imagem_github}" alt="${data.titulo}" />`
      : '';

    content.innerHTML = `
      <a class="back-link" href="index.html">← Voltar para notícias</a>

      <div class="article-meta">
        <span class="article-fonte">${data.fonte || 'Saúde'}</span>
        <span class="article-data">${formatDate(data.publicado_em)}</span>
      </div>

      <h1 class="article-title">${data.titulo}</h1>

      ${imgHTML}

      <div class="article-body">${renderMarkdown(data.artigo_completo || '')}</div>

      <div class="article-divider"></div>

      <div class="article-cta">
        <h3>Economize tempo no consultório</h3>
        <p>O Médico AI gera prontuários SOAP, prescrições digitais e pedidos de exame em segundos — para você focar no que importa: o paciente.</p>
        <a href="https://medicoai.com.br" target="_blank" rel="noopener">Conhecer o Médico AI →</a>
      </div>
    `;
  }

  loadArtigo();
</script>
</body>
</html>
